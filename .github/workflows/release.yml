name: Release

# Baut, signiert und veröffentlicht die App zu einem Tag vX.Y.Z (angezeigt
# X.YY, versionCode X*100+Y). Signiert wird nur im Job „publish“ in der
# Umgebung „release“: Sie lässt nur Tags v* zu und wartet auf die Freigabe
# des Inhabers. Der Schlüssel liegt dort als Secret und nur für die Dauer
# des Jobs auf dem Runner.
#
# Probelauf: „Run workflow“ auf einem Tag mit dry_run=true baut und
# signiert, legt die APK als Artefakt ab und veröffentlicht nichts.

on:
  push:
    # Nur echte Versionen veröffentlichen; ein Probe-Tag (v0.1.0-probe) läuft
    # nur von Hand als Probelauf.
    tags: ['v[0-9]+.[0-9]+.0']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur bauen und signieren, nichts veröffentlichen'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # SHA-256 des Signaturzertifikats (CN=TitanOS Android, O=ra5on). Jede
  # Version muss es tragen, sonst lässt Android kein Update zu.
  CERT_SHA256: 636b57237912ac4a030b7c203090913a2e3e7aa5582d0f28f61a9f247602725c

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Android SDK (Plattform 37.0, Build-Tools 37.0.0)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Tag und Version
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.0$ ]]; then
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "${{ inputs.dry_run }}" = true ]; then
              echo "::notice::Probelauf auf $tag: Versionsprüfung übersprungen"; exit 0
            fi
            echo "::error::Release nur von einem Tag vX.Y.0 (ist: $tag)"; exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]}
          want_name=$(printf '%d.%02d' "$major" "$minor")
          want_code=$((major * 100 + minor))
          for app in app-titanos app-agent; do
            name=$(sed -nE 's/^\s*versionName = "([^"]+)".*/\1/p' $app/build.gradle.kts)
            code=$(sed -nE 's/^\s*versionCode = ([0-9]+).*/\1/p' $app/build.gradle.kts)
            if [ "$name" != "$want_name" ] || [ "$code" != "$want_code" ]; then
              echo "::error::$app: versionName $name / versionCode $code, erwartet $want_name / $want_code für $tag"; exit 1
            fi
          done
      - name: Tests und Lint
        run: ./gradlew --no-daemon testDebugUnitTest lint :lint-rules:test

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Kein Gradle-Cache aus dem Job mit dem Schlüssel.
          cache-disabled: true
      - name: Android SDK (Plattform 37.0, Build-Tools 37.0.0)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Bauen und signieren
        env:
          KEYSTORE_BASE64: ${{ secrets.TITANOS_KEYSTORE_BASE64 }}
          TITANOS_KEYSTORE_PASSWORD: ${{ secrets.TITANOS_KEYSTORE_PASSWORD }}
        run: |
          umask 077
          export TITANOS_KEYSTORE="$RUNNER_TEMP/titanos-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$TITANOS_KEYSTORE"
          trap 'rm -f "$TITANOS_KEYSTORE"' EXIT
          ./gradlew --no-daemon :app-titanos:assembleRelease :app-agent:assembleRelease
      - name: Signatur und Version prüfen
        run: |
          bt="$ANDROID_HOME/build-tools/37.0.0"
          mkdir -p out
          for pair in "app-titanos:TitanOS-Android" "app-agent:TitanOS-Agent"; do
            module=${pair%%:*} prefix=${pair##*:}
            apk=$module/build/outputs/apk/release/$module-release.apk
            # Die Agent-App ist erst ab 0.03 dabei; fehlt sie, bleibt es bei der TitanOS-App.
            [ -f "$apk" ] || { [ "$module" = app-agent ] && continue; echo "::error::$apk fehlt"; exit 1; }
            "$bt/apksigner" verify --print-certs "$apk" | tee signer.txt
            grep -q "certificate SHA-256 digest: $CERT_SHA256" signer.txt || { echo "::error::falsches Signaturzertifikat ($module)"; exit 1; }
            name=$("$bt/aapt2" dump badging "$apk" | sed -nE "s/.*versionName='([^']+)'.*/\1/p")
            cp "$apk" "out/$prefix-$name.apk"
            [ "$module" = app-titanos ] && echo "NAME=$name" >> "$GITHUB_ENV"
          done
          (cd out && sha256sum *.apk > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: titanos-android-release
          path: out/
      - name: Veröffentlichen
        if: github.event_name == 'push' || (inputs.dry_run == false && startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="docs/releases/$tag.md"
          [ -f "$notes" ] || { echo "::error::$notes fehlt"; exit 1; }
          # Vor 1.00 sind es Testfassungen (Vorab-Release, nicht „Latest“).
          pre=""
          case "$tag" in v0.*) pre="--prerelease" ;; esac
          title="TitanOS für Android $NAME"
          [ -n "$pre" ] && title="$title (Testfassung)"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber
          else
            gh release create "$tag" $pre --title "$title" --notes-file "$notes" out/*
          fi
