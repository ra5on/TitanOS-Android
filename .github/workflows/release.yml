name: Release

# Baut, signiert und veröffentlicht die App zu einem Tag vX.Y.Z (angezeigt
# X.YY, versionCode X*100+Y). Signiert wird nur im Job „publish“ in der
# Umgebung „release“: Sie lässt nur Tags v* zu und wartet auf die Freigabe
# des Inhabers. Der Schlüssel liegt dort als Secret und nur für die Dauer
# des Jobs auf dem Runner.
#
# Gradle baut unsigniert; signiert wird in einem eigenen Schritt nur mit
# apksigner, damit der Schlüssel nie im Gradle-Build liegt.
#
# Probelauf: „Run workflow“ auf einem Tag mit dry_run=true baut und
# signiert mit einem Wegwerfschlüssel aus dem Lauf (nie mit dem
# Produktionsschlüssel), legt die APK als Artefakt ab und veröffentlicht nichts.
#
# Bauvarianten (PLAN 116): veröffentlicht wird nur „github“ (mit Selbst-Update).
# „play“ (Google Play, ohne Selbst-Update) entsteht als unsigniertes AAB im
# Artefakt „titanos-android-play“; signiert und hochgeladen wird es von Hand
# mit dem Upload-Schlüssel, sobald der Inhaber Google Play entscheidet.
# Die Versionshinweise kommen aus docs/releases/<tag>.md (wie bei TitanOS).

on:
  push:
    # Nur echte Versionen veröffentlichen; ein Probe-Tag (v0.1.0-probe) läuft
    # nur von Hand als Probelauf.
    tags: ['v[0-9]+.[0-9]+.0']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Nur bauen und signieren, nichts veröffentlichen'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # SHA-256 des Signaturzertifikats (CN=TitanOS Android, O=ra5on). Jede
  # Version muss es tragen, sonst lässt Android kein Update zu.
  CERT_SHA256: 636b57237912ac4a030b7c203090913a2e3e7aa5582d0f28f61a9f247602725c

jobs:
  test:
    runs-on: ubuntu-latest
    # Ab 1.00 viele Module und Bildtests: lokal (3 Worker) 45 Minuten für Bauen, Tests und Lint.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Android SDK (Plattform 37.0, Build-Tools 37.0.0)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"
      - name: Tag und Version
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v([0-9]+)\.([0-9]+)\.0$ ]]; then
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "${{ inputs.dry_run }}" = true ]; then
              echo "::notice::Probelauf auf $tag: Versionsprüfung übersprungen"; exit 0
            fi
            echo "::error::Release nur von einem Tag vX.Y.0 (ist: $tag)"; exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]}
          want_name=$(printf '%d.%02d' "$major" "$minor")
          want_code=$((major * 100 + minor))
          # Ab 1.01 ohne die Agent-App: ihr Agent steckt in der TitanOS-App, ihre letzte Fassung 1.00 bleibt auf GitHub.
          for app in app-titanos app-watch; do
            name=$(sed -nE 's/^\s*versionName = "([^"]+)".*/\1/p' $app/build.gradle.kts)
            code=$(sed -nE 's/^\s*versionCode = ([0-9]+).*/\1/p' $app/build.gradle.kts)
            if [ "$name" != "$want_name" ] || [ "$code" != "$want_code" ]; then
              echo "::error::$app: versionName $name / versionCode $code, erwartet $want_name / $want_code für $tag"; exit 1
            fi
          done
      - name: Tests und Lint
        # testDebugUnitTest läuft nur in Modulen ohne Bauvarianten; die App TitanOS hat github/play.
        run: ./gradlew --no-daemon testDebugUnitTest :app-titanos:testGithubDebugUnitTest lint :app-titanos:lintPlayDebug :lint-rules:test

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Kein Gradle-Cache aus dem Job mit dem Schlüssel.
          cache-disabled: true
      - name: Android SDK (Plattform 37.0, Build-Tools 37.0.0)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"
      # Gradle baut unsigniert und sieht den Schlüssel nie; signiert wird danach nur mit apksigner.
      - name: Bauen (unsigniert)
        run: ./gradlew --no-daemon :app-titanos:assembleGithubRelease :app-watch:assembleRelease :app-titanos:bundlePlayRelease
      # Probelauf: nie der Produktionsschlüssel, sondern ein Wegwerfschlüssel aus diesem Lauf.
      - name: Signieren
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          # Im Probelauf leer: der Produktionsschlüssel kommt gar nicht erst in den Schritt.
          KEYSTORE_BASE64: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && secrets.TITANOS_KEYSTORE_BASE64 || '' }}
          KEYSTORE_PASSWORD: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && secrets.TITANOS_KEYSTORE_PASSWORD || '' }}
        run: |
          umask 077
          bt="$ANDROID_HOME/build-tools/37.0.0"
          ks="$RUNNER_TEMP/titanos-sign.p12"
          trap 'rm -f "$ks"' EXIT
          if [ "$DRY_RUN" = true ]; then
            KEYSTORE_PASSWORD=$(openssl rand -hex 24)
            keytool -genkeypair -keystore "$ks" -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" -alias titanos-release \
              -keyalg RSA -keysize 3072 -validity 2 -dname "CN=TitanOS Probelauf (Wegwerfschluessel)" > /dev/null
            # Die Prüfung unten vergleicht dann mit dem Wegwerfzertifikat.
            digest=$(keytool -exportcert -keystore "$ks" -storepass "$KEYSTORE_PASSWORD" -alias titanos-release | sha256sum | cut -d' ' -f1)
            echo "PROBE_CERT_SHA256=$digest" >> "$GITHUB_ENV"
            echo "::notice::Probelauf: signiert mit einem Wegwerfschlüssel, nicht installierbar als Update"
          else
            [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] || { echo "::error::Schlüssel fehlt"; exit 1; }
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$ks"
          fi
          # Ausgabe je Modul: die Apps mit Bauvarianten unter apk/github/release, die Uhr ohne.
          for pair in "app-titanos:github/release:app-titanos-github-release" "app-watch:release:app-watch-release"; do
            module=${pair%%:*} rest=${pair#*:}
            dir=$module/build/outputs/apk/${rest%%:*} base=${rest#*:}
            [ -f "$dir/$base-unsigned.apk" ] || continue
            # Wie die signingConfig in Gradle: v2 und v3 (ab Android 13 kein v1).
            "$bt/apksigner" sign --ks "$ks" --ks-type PKCS12 --ks-key-alias titanos-release \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
              --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
              --out "$dir/$module-release.apk" "$dir/$base-unsigned.apk"
            "$bt/zipalign" -c -P 16 4 "$dir/$module-release.apk"
          done
      - name: Signatur und Version prüfen
        run: |
          bt="$ANDROID_HOME/build-tools/37.0.0"
          mkdir -p out
          # Ab 1.00 auch die Uhr-App (Wear OS, io.github.ra5on.titanos.watch), gleicher Schlüssel.
          # Ab 1.01 ohne die Agent-App (TitanOS-Agent-X.YY.apk): Updates sucht die App nur noch für sich und die Uhr.
          for pair in "app-titanos:github/release:TitanOS-Android" "app-watch:release:TitanOS-Watch"; do
            module=${pair%%:*} rest=${pair#*:} prefix=${pair##*:}
            apk=$module/build/outputs/apk/${rest%%:*}/$module-release.apk
            [ -f "$apk" ] || { echo "::error::$apk fehlt"; exit 1; }
            "$bt/apksigner" verify --print-certs "$apk" | tee signer.txt
            grep -q "certificate SHA-256 digest: ${PROBE_CERT_SHA256:-$CERT_SHA256}" signer.txt || { echo "::error::falsches Signaturzertifikat ($module)"; exit 1; }
            name=$("$bt/aapt2" dump badging "$apk" | sed -nE "s/.*versionName='([^']+)'.*/\1/p")
            cp "$apk" "out/$prefix-$name.apk"
            [ "$module" = app-titanos ] && echo "NAME=$name" >> "$GITHUB_ENV"
          done
          (cd out && sha256sum *.apk > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: titanos-android-release
          path: out/
      # Google Play: unsigniert, nur als Artefakt (nicht im Release).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: titanos-android-play
          path: |
            app-titanos/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error
      - name: Veröffentlichen
        if: github.event_name == 'push' || (inputs.dry_run == false && startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="docs/releases/$tag.md"
          [ -f "$notes" ] || { echo "::error::$notes fehlt"; exit 1; }
          # Vor 1.00 sind es Testfassungen (Vorab-Release, nicht „Latest“); ab v1.0.0 normale Releases.
          pre=""
          case "$tag" in v0.*) pre="--prerelease" ;; esac
          title="TitanOS für Android $NAME"
          [ -n "$pre" ] && title="$title (Testfassung)"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber
          else
            gh release create "$tag" $pre --title "$title" --notes-file "$notes" out/*
          fi
